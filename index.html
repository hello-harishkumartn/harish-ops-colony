<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Harish Ops Colony — loading…</title>
<style>
html,body{height:100%;margin:0;background:#050505;color:#f5e6c8;font-family:system-ui,sans-serif;display:grid;place-items:center}
.box{text-align:center}.spin{width:28px;height:28px;border:2px solid #fbbf24;border-top-color:transparent;border-radius:50%;margin:0 auto 12px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style></head><body>
<div class="box"><div class="spin"></div><div id="m">Booting ops colony…</div></div>
<script type="module">
const PARTS=19;
const EXPECT="3fe8a36328682a34a06c528f6668ee7c19e2dc3c155fb4ca2cbe259d93a49eb4";
const m=document.getElementById('m');
function hexToBytes(h){
  const out=new Uint8Array(h.length/2);
  for(let i=0;i<out.length;i++) out[i]=parseInt(h.substr(i*2,2),16);
  return out;
}
async function sha256hex(buf){
  const d=await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function parseTar(bytes){
  const files={}; let offset=0; const dec=new TextDecoder();
  while(offset+512<=bytes.length){
    const header=bytes.subarray(offset,offset+512);
    if(header.every(b=>b===0)) break;
    const name=dec.decode(header.subarray(0,100)).replace(/\0.*$/,'');
    const size=parseInt(dec.decode(header.subarray(124,136)).replace(/\0/g,'').trim(),8)||0;
    offset+=512;
    if(name) files[name]=bytes.subarray(offset,offset+size);
    offset+=Math.ceil(size/512)*512;
  }
  return files;
}
try{
  m.textContent='Fetching colony…';
  let hx='';
  for(let i=0;i<PARTS;i++){
    const r=await fetch('./assets/site.hex.'+i+'?t='+Date.now());
    if(!r.ok) throw new Error('missing part '+i);
    hx+=(await r.text()).trim();
  }
  const gz=hexToBytes(hx);
  const hash=await sha256hex(gz);
  if(hash!==EXPECT) throw new Error('hash mismatch '+hash.slice(0,12));
  m.textContent='Inflating…';
  const ds=new DecompressionStream('gzip');
  const tarBuf=new Uint8Array(await new Response(new Blob([gz]).stream().pipeThrough(ds)).arrayBuffer());
  const files=parseTar(tarBuf);
  const html=new TextDecoder().decode(files['index.html']);
  const js=new TextDecoder().decode(files['colony.js']);
  const status=files['status.json']?new TextDecoder().decode(files['status.json']):null;
  if(status){
    const realFetch=window.fetch.bind(window);
    window.fetch=(input,init)=>{
      const url=typeof input==='string'?input:(input&&input.url)||'';
      if(url.includes('status.json')) return Promise.resolve(new Response(status,{headers:{'Content-Type':'application/json'}}));
      return realFetch(input,init);
    };
  }
  const jsBlob=URL.createObjectURL(new Blob([js],{type:'text/javascript'}));
  const doc=new DOMParser().parseFromString(html,'text/html');
  document.head.innerHTML=''; document.body.innerHTML='';
  for(const node of [...doc.head.childNodes]){
    if(node.nodeName==='SCRIPT'&&node.getAttribute('type')==='module') continue;
    document.head.appendChild(document.importNode(node,true));
  }
  document.documentElement.setAttribute('data-theme', doc.documentElement.getAttribute('data-theme')||'desert');
  for(const node of [...doc.body.childNodes]){
    if(node.nodeName==='SCRIPT'&&node.getAttribute('type')==='module') continue;
    document.body.appendChild(document.importNode(node,true));
  }
  const s=document.createElement('script'); s.type='module'; s.src=jsBlob; document.body.appendChild(s);
}catch(e){ m.textContent='Boot failed: '+e.message; console.error(e); }
</script></body></html>
