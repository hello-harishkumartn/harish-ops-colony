<!DOCTYPE html>
<html lang="en" data-theme="desert">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Harish Ops Colony — 3D</title>
<style>
  :root, [data-theme="desert"] {
    --panel: rgba(10, 8, 16, 0.72);
    --panel-border: rgba(255, 200, 120, 0.22);
    --text: #f5e6c8; --muted: #a89070; --sand: #e8c48a;
    --title-grad: linear-gradient(90deg, #fde68a, #fbbf24, #f59e0b);
    --teal: #2dd4bf; --yellow: #fbbf24; --green: #4ade80; --pink: #fb7185; --blue: #60a5fa;
    --glass: rgba(255,255,255,0.06);
  }
  [data-theme="ocean"] {
    --panel: rgba(4, 16, 28, 0.76);
    --panel-border: rgba(100, 220, 255, 0.24);
    --text: #e0f7ff; --muted: #7eb8c9; --sand: #a8e6f5;
    --title-grad: linear-gradient(90deg, #7dd3fc, #38bdf8, #06b6d4);
  }
  [data-theme="forest"] {
    --panel: rgba(6, 14, 8, 0.78);
    --panel-border: rgba(140, 220, 120, 0.22);
    --text: #e8f5e0; --muted: #8aaa7a; --sand: #c5e8a8;
    --title-grad: linear-gradient(90deg, #bef264, #86efac, #4ade80);
  }
  [data-theme="sky"] {
    --panel: rgba(16, 30, 52, 0.7);
    --panel-border: rgba(200, 230, 255, 0.26);
    --text: #f0f7ff; --muted: #a8c0d8; --sand: #dceeff;
    --title-grad: linear-gradient(90deg, #ffffff, #bae6fd, #7dd3fc);
  }
  [data-theme="city"] {
    --panel: rgba(6, 4, 16, 0.8);
    --panel-border: rgba(200, 100, 255, 0.26);
    --text: #f0e8ff; --muted: #a090c0; --sand: #e0c8ff;
    --title-grad: linear-gradient(90deg, #f0abfc, #c084fc, #22d3ee);
    --pink: #e879f9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); background: #050505; }
  #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

  .ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: grid; grid-template-rows: auto 1fr auto; padding: 10px 12px max(8px, env(safe-area-inset-bottom)); gap: 8px; max-width: 1600px; margin: 0 auto; left: 0; right: 0; }
  .ui > * { pointer-events: auto; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 16px; backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
    box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .brand h1 {
    font-size: 1.05rem; font-weight: 700; letter-spacing: 0.04em;
    background: var(--title-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand p { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
  .top-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
    font-size: 0.68rem; font-weight: 600; background: var(--glass);
    border: 1px solid var(--panel-border); color: var(--sand); white-space: nowrap;
  }
  .chip.mudrex { background: rgba(45,212,191,0.12); border-color: rgba(45,212,191,0.4); color: var(--teal); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse-dot 2s ease-in-out infinite; }
  .chip.poll.live .dot { background: var(--teal); box-shadow: 0 0 8px var(--teal); }
  .chip.poll.err .dot { background: var(--pink); box-shadow: 0 0 8px var(--pink); animation: none; }
  @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.55;transform:scale(.85)} }

  .theme-switch {
    display: flex; gap: 2px; padding: 3px; border-radius: 999px;
    background: rgba(0,0,0,0.35); border: 1px solid var(--panel-border);
  }
  .theme-btn {
    border: none; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 0.58rem; font-weight: 700; padding: 5px 8px; border-radius: 999px;
    letter-spacing: 0.03em; text-transform: uppercase; transition: all .2s;
    min-height: 28px;
  }
  .theme-btn:hover { color: var(--sand); }
  .theme-btn.active { background: rgba(255,255,255,0.14); color: var(--text); box-shadow: 0 0 12px rgba(255,255,255,0.08); }

  .mid {
    display: grid; grid-template-columns: minmax(200px, 270px) 1fr minmax(220px, 290px);
    gap: 10px; min-height: 0; pointer-events: none; position: relative;
  }
  .mid > .panel { pointer-events: auto; }
  .panel {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px;
    backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    transition: opacity .2s, transform .2s;
  }
  .panel h2 {
    font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); padding: 12px 14px 8px; border-bottom: 1px solid var(--panel-border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-close {
    display: none; border: none; background: rgba(255,255,255,0.08); color: var(--sand);
    width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 1rem; line-height: 1;
  }
  .panel-body { overflow-y: auto; padding: 8px 10px 12px; flex: 1; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; -webkit-overflow-scrolling: touch; }
  .spacer { pointer-events: none !important; }

  .routine, .act {
    padding: 8px 10px; border-radius: 10px; margin-bottom: 6px;
    background: rgba(255,255,255,0.03); border: 1px solid transparent;
  }
  .routine:hover, .act:hover { border-color: var(--panel-border); background: rgba(255,255,255,0.05); }
  .routine .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .routine .name { font-size: 0.76rem; font-weight: 600; }
  .routine .sched { font-size: 0.62rem; color: var(--muted); margin-top: 2px; }
  .pill {
    font-size: 0.56rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 2px 7px; border-radius: 999px; white-space: nowrap;
  }
  .pill.ok, .pill.idle { background: rgba(74,222,128,0.15); color: var(--green); }
  .pill.watching, .pill.active { background: rgba(45,212,191,0.18); color: var(--teal); }
  .pill.pending { background: rgba(251,191,36,0.18); color: var(--yellow); }
  .pill.never, .pill.err { background: rgba(251,113,133,0.15); color: var(--pink); }

  .act { display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: start; }
  .act .t { font-size: 0.62rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .act .b { font-size: 0.72rem; line-height: 1.35; color: var(--text); }
  .act .b em { font-style: normal; font-weight: 700; }
  .act.teal .t { color: var(--teal); }
  .act.yellow .t { color: var(--yellow); }
  .act.green .t { color: var(--green); }
  .act.pink .t { color: var(--pink); }
  .act.blue .t { color: var(--blue); }

  .foot {
    display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 7px 12px; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; backdrop-filter: blur(14px); font-size: 0.65rem; color: var(--muted);
  }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px currentColor; }
  .legend .c-teal { color: var(--teal); background: var(--teal); }
  .legend .c-yellow { color: var(--yellow); background: var(--yellow); }
  .legend .c-green { color: var(--green); background: var(--green); }
  .legend .c-pink { color: var(--pink); background: var(--pink); }
  .legend .c-blue { color: var(--blue); background: var(--blue); }

  /* Floating panel toggles — always available, primary UX on mobile */
  .fab-bar {
    position: fixed; z-index: 30; left: 50%; bottom: max(72px, calc(env(safe-area-inset-bottom) + 64px));
    transform: translateX(-50%); display: none; gap: 8px; pointer-events: auto;
  }
  .fab {
    border: 1px solid var(--panel-border); background: var(--panel);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    color: var(--sand); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
    padding: 10px 16px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 28px rgba(0,0,0,0.45); min-height: 40px;
    display: inline-flex; align-items: center; gap: 6px; -webkit-tap-highlight-color: transparent;
  }
  .fab.on { color: var(--text); border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.12); }
  .fab .badge { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 6px var(--teal); }

  .tip {
    position: fixed; z-index: 20; pointer-events: none; display: none;
    max-width: min(260px, 80vw); padding: 10px 12px; border-radius: 12px;
    background: rgba(8,8,14,0.92); border: 1px solid var(--panel-border);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
    font-size: 0.74rem; line-height: 1.4;
  }
  .tip strong { display: block; margin-bottom: 4px; font-size: 0.82rem; }
  .tip .meta { color: var(--muted); font-size: 0.66rem; margin-top: 4px; }

  .hint {
    position: fixed; z-index: 15; left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%); pointer-events: none;
    font-size: 0.62rem; color: var(--muted); opacity: 0.75;
    padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,0.35);
    white-space: nowrap;
  }

  /* Desktop: panels open by default */
  @media (min-width: 769px) {
    .fab-bar { display: none !important; }
    .panel-close { display: none !important; }
    #routinesPanel, #activityPanel { display: flex !important; opacity: 1; transform: none; }
  }

  /* Mobile: full-screen canvas, panels hidden by default, floating chips */
  @media (max-width: 768px) {
    .ui { padding: 8px 8px max(6px, env(safe-area-inset-bottom)); gap: 6px; }
    .brand p { display: none; }
    .brand h1 { font-size: 0.92rem; }
    .theme-btn { padding: 5px 7px; font-size: 0.52rem; }
    .chip.mudrex { max-width: 42vw; overflow: hidden; text-overflow: ellipsis; }
    .mid {
      grid-template-columns: 1fr;
      pointer-events: none;
    }
    .spacer { display: none; }
    .foot .legend { display: none; }
    .fab-bar { display: flex; }
    .panel-close { display: inline-flex; align-items: center; justify-content: center; }

    #routinesPanel, #activityPanel {
      display: none;
      position: fixed;
      left: 8px; right: 8px;
      max-height: min(48vh, 380px);
      z-index: 25;
      pointer-events: auto;
    }
    #routinesPanel { top: 72px; }
    #activityPanel { bottom: max(120px, calc(env(safe-area-inset-bottom) + 110px)); }

    body.panel-routines-open #routinesPanel { display: flex; }
    body.panel-activity-open #activityPanel { display: flex; }
    body.panel-routines-open .fab[data-panel="routines"],
    body.panel-activity-open .fab[data-panel="activity"] { color: var(--text); border-color: rgba(255,255,255,0.4); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui">
  <header class="topbar">
    <div class="brand">
      <h1>HARISH OPS COLONY</h1>
      <p>3D robot fleet · drag orbit · pinch/scroll zoom · themes reshape the world</p>
    </div>
    <div class="top-chips">
      <div class="chip mudrex" id="mudrexChip">Mudrex —</div>
      <div class="chip poll live" id="pollChip"><span class="dot"></span><span id="pollLabel">polling…</span></div>
      <div class="theme-switch" id="themeSwitch" role="group" aria-label="Theme">
        <button type="button" class="theme-btn active" data-theme="desert">Desert</button>
        <button type="button" class="theme-btn" data-theme="ocean">Ocean</button>
        <button type="button" class="theme-btn" data-theme="forest">Forest</button>
        <button type="button" class="theme-btn" data-theme="sky">Sky</button>
        <button type="button" class="theme-btn" data-theme="city">City</button>
      </div>
    </div>
  </header>

  <div class="mid">
    <aside class="panel" id="routinesPanel">
      <h2>Routines <button type="button" class="panel-close" data-close="routines" aria-label="Close">×</button></h2>
      <div class="panel-body" id="routines"></div>
    </aside>
    <div class="spacer"></div>
    <aside class="panel" id="activityPanel">
      <h2>Live activity <button type="button" class="panel-close" data-close="activity" aria-label="Close">×</button></h2>
      <div class="panel-body" id="activity"></div>
    </aside>
  </div>

  <footer class="foot">
    <div class="legend">
      <span><i class="c-teal"></i> Crypto</span>
      <span><i class="c-yellow"></i> Placement</span>
      <span><i class="c-green"></i> Investment</span>
      <span><i class="c-pink"></i> Equity</span>
      <span><i class="c-blue"></i> Harish PA</span>
    </div>
    <div id="refreshMeta">status.json · every 30s</div>
  </footer>
</div>

<nav class="fab-bar" aria-label="Panel toggles">
  <button type="button" class="fab" data-panel="routines"><span class="badge"></span> Routines</button>
  <button type="button" class="fab" data-panel="activity"><span class="badge"></span> Activity</button>
</nav>

<div class="hint" id="orbitHint">Drag to orbit · pinch to zoom</div>
<div class="tip" id="tip"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./colony.js"></script>
</body>
</html>
